<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>勇者日常挑戰</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
    
    body { background-color: #1d1d1d; margin: 0; padding: 0; overscroll-behavior: none; }
    .pixel-font { font-family: 'DotGothic16', sans-serif; letter-spacing: 1px; }
    
    .mc-panel {
      background-color: #3b3b3b; border: 4px solid; border-top-color: #5e5e5e; border-left-color: #5e5e5e;
      border-bottom-color: #1f1f1f; border-right-color: #1f1f1f; color: #fff;
    }
    
    .mc-button {
      background-color: #7a7a7a; border: 4px solid; border-top-color: #a4a4a4; border-left-color: #a4a4a4;
      border-bottom-color: #383838; border-right-color: #383838; color: #fff; text-shadow: 2px 2px 0 #222;
      cursor: pointer; transition: transform 0.05s; user-select: none;
    }
    
    .mc-button:active {
      border-top-color: #383838; border-left-color: #383838; border-bottom-color: #a4a4a4; border-right-color: #a4a4a4;
      transform: translate(2px, 2px);
    }
    
    .mc-wood { background-color: #8b5a2b; border-top-color: #b07e46; border-left-color: #b07e46; border-bottom-color: #5c3a18; border-right-color: #5c3a18; }
    .mc-grass { background-color: #4caf50; border-top-color: #81c784; border-left-color: #81c784; border-bottom-color: #2e7d32; border-right-color: #2e7d32; }
    .mc-diamond { background-color: #00bcd4; border-top-color: #4dd0e1; border-left-color: #4dd0e1; border-bottom-color: #006064; border-right-color: #006064; }
    .mc-redstone { background-color: #e53935; border-top-color: #ef5350; border-left-color: #ef5350; border-bottom-color: #b71c1c; border-right-color: #b71c1c; }
    .mc-gold { background-color: #fbc02d; border-top-color: #fff59d; border-left-color: #fff59d; border-bottom-color: #f57f17; border-right-color: #f57f17; color: #3e2723; text-shadow: none; }
    .mc-obsidian { background-color: #212121; border-top-color: #424242; border-left-color: #424242; border-bottom-color: #000; border-right-color: #000; }
    
    /* 告示牌材質 */
    .mc-sign { background-color: #d7b57b; border: 4px solid; border-top-color: #ebd197; border-left-color: #ebd197; border-bottom-color: #8f6736; border-right-color: #8f6736; color: #3e2723; }

    .mc-input {
      background-color: #111; border: 4px solid; border-top-color: #555; border-left-color: #555;
      border-bottom-color: #aaa; border-right-color: #aaa; color: white; padding: 8px; outline: none;
    }
    .mc-input:focus { border-color: #4dd0e1; }

    .card-check-anim { animation: cardPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    @keyframes cardPop { 0% { transform: scale(0.2); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 0.2; } }
    .exp-float { position: absolute; color: #4ff; font-weight: bold; animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 10; text-shadow: 2px 2px 0 #000; }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.5); } }
    .celebrate-pop { animation: popInBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    @keyframes popInBounce { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .spin-glow { position: absolute; inset: -50%; background: conic-gradient(from 0deg, transparent, rgba(253,224,71,0.2) 20%, transparent 40%); animation: spin 3s linear infinite; pointer-events: none; z-index: -1; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #111; border: 1px solid #555; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border: 1px solid #fff; }

    /* 跑馬燈動畫 CSS */
    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      width: 100%;
    }
    .marquee-content {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 20s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }
  </style>
</head>
<body>
  
  <div id="syntax-error" style="display:none; background:red; color:white; padding:20px; font-weight:bold; position:fixed; top:0; left:0; width:100%; z-index:9999;"></div>
  <script>
    window.onerror = function(message) {
      document.getElementById('syntax-error').style.display = 'block';
      document.getElementById('syntax-error').innerHTML = '🚨 網頁語法錯誤：' + message;
    };
  </script>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 🌟 Google Apps Script (GAS) 網址設定處
    // 請將您從 Google 試算表「部署為網頁應用程式」取得的 URL 貼在下方：
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyxyLJou8ImyKOU3FfjiBn8oRJl4L0G_n7lVgFIUS_DbXeHY2TK-ziFQv_lJkiXdpur0w/exec";

    // API 呼叫工具
    async function apiGet(action = 'initData') {
      const res = await fetch(`${GAS_API_URL}?action=${action}`);
      return await res.json();
    }

    async function apiPost(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    const SYSTEM_VERSION = `v.${new Date().getFullYear()}${String(new Date().getMonth() + 1).padStart(2, '0')}${String(new Date().getDate()).padStart(2, '0')}`;
    const TODAY_STR = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;
    const NOW = Date.now();
    const getDaysDiff = (date1, date2) => Math.floor((new Date(date2.getFullYear(), date2.getMonth(), date2.getDate()).getTime() - new Date(date1.getFullYear(), date1.getMonth(), date1.getDate()).getTime()) / 86400000);

    const DAILY_KNOWLEDGE = [
      { tag: '節氣', title: '立秋', content: '代表夏天即將結束，秋天要開始了！早晚會漸漸變涼喔。' },
      { tag: '諺語', title: 'Practice makes perfect.', content: '熟能生巧。只要多練習，就能把事情做得更好！' },
      { tag: '歷史', title: '愛迪生 (Thomas Edison)', content: '發明了實用的白熾燈泡，讓人類在夜晚也能擁有明亮的光線！' },
      { tag: '諺語', title: 'A piece of cake.', content: '一塊蛋糕。形容事情非常簡單，輕而易舉！' },
      { tag: '節氣', title: '處暑', content: '「處」是退去的意思，代表夏天的炎熱終於要退去了。' },
      { tag: '歷史', title: '萊特兄弟 (Wright brothers)', content: '發明世界上第一架成功飛行的飛機，實現人類飛上天空的夢想！' },
      { tag: '諺語', title: 'Never give up.', content: '永不放棄。遇到困難時，堅持下去就會看到希望！' },
      { tag: '歷史', title: '居禮夫人 (Marie Curie)', content: '發現放射性元素，是第一位獲得兩次諾貝爾獎的偉大女科學家！' },
      { tag: '節氣', title: '白露', content: '天氣開始轉涼，早晨的草木上會結出白色的露水。' },
      { tag: '諺語', title: 'Time is money.', content: '時間就是金錢。提醒我們要好好珍惜光陰，不要浪費時間。' }
    ];
    const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
    const todayKnowledge = DAILY_KNOWLEDGE[dayOfYear % DAILY_KNOWLEDGE.length];

    function App() {
      // 🚀 0 秒秒開快取：先從瀏覽器讀取上次的資料，立刻呈現畫面，背後靜默聯網更新！
      const [usersData, setUsersData] = useState(() => {
        try {
          const cached = localStorage.getItem('hero_tracker_cache_v2');
          if (cached) return JSON.parse(cached);
        } catch (e) {}
        return null;
      });
      const [currentUser, setCurrentUser] = useState(null); // 'player1', 'player2', 'admin' (村長), 'admin2' (國王)
      const [view, setView] = useState('login'); 
      const [pinInput, setPinInput] = useState('');
      const [targetLogin, setTargetLogin] = useState(null);
      const [animatingTask, setAnimatingTask] = useState(null);
      const [loading, setLoading] = useState(() => {
        try {
          return !localStorage.getItem('hero_tracker_cache_v2');
        } catch (e) {
          return true;
        }
      });
      const [fatalError, setFatalError] = useState(null);
      
      const [currentTime, setCurrentTime] = useState(Date.now());
      const [showCalendar, setShowCalendar] = useState(false);
      const [showDiary, setShowDiary] = useState(false);
      const [showChangelog, setShowChangelog] = useState(false);
      const [calMonthOffset, setCalMonthOffset] = useState(0); 
      const [showAdminCalendar, setShowAdminCalendar] = useState(false);
      const [adminCalPlayer, setAdminCalPlayer] = useState('player1');
      const [adminCalMonthOffset, setAdminCalMonthOffset] = useState(0);
      const [editingDayRecord, setEditingDayRecord] = useState(null);
      const [celebration, setCelebration] = useState({ show: false, title: '', message: '', type: '' });
      const [adminTab, setAdminTab] = useState('overview'); 
      const [adminTargetPlayer, setAdminTargetPlayer] = useState('player1');
      const [editSettings, setEditSettings] = useState(() => {
        try {
          const cached = localStorage.getItem('hero_tracker_cache_v2');
          if (cached) {
            const d = JSON.parse(cached);
            return {
              player1: { name: d.player1?.name || '', pin: d.player1?.pin || '' },
              player2: { name: d.player2?.name || '', pin: d.player2?.pin || '' }
            };
          }
        } catch (e) {}
        return { player1: { name: '', pin: '' }, player2: { name: '', pin: '' } };
      });
      const [editAdminPin, setEditAdminPin] = useState(() => {
        try {
          const cached = localStorage.getItem('hero_tracker_cache_v2');
          if (cached) return JSON.parse(cached).adminPin || '9999';
        } catch (e) {}
        return '9999';
      });
      const [editAdmin2Pin, setEditAdmin2Pin] = useState(() => {
        try {
          const cached = localStorage.getItem('hero_tracker_cache_v2');
          if (cached) return JSON.parse(cached).admin2Pin || '8888';
        } catch (e) {}
        return '8888';
      });
      
      const [taskTargetMode, setTaskTargetMode] = useState('both'); 
      const [newTaskForm, setNewTaskForm] = useState({ title: '', freqType: 'daily', freqValue: 2, freqWeekly: [] });
      
      const [assessmentTargetMode, setAssessmentTargetMode] = useState('both');
      const [newAssessmentForm, setNewAssessmentForm] = useState({ title: '', reason: '', count: 1 });

      const [diaryInput, setDiaryInput] = useState('');
      const diaryEndRef = useRef(null);
      const [alertMsg, setAlertMsg] = useState(null);
      const alertTip = (msg) => { setAlertMsg(msg); setTimeout(() => setAlertMsg(null), 3500); };
      const [confirmDialog, setConfirmDialog] = useState(null);

      // 家規公告相關狀態
      const [showHouseRules, setShowHouseRules] = useState(false);
      const [editingRule, setEditingRule] = useState(null);
      const [newRuleForm, setNewRuleForm] = useState({ title: '', content: '' });
      const [savingRule, setSavingRule] = useState(false);

      // LINE 家庭群組連線設定
      const [editLineToken, setEditLineToken] = useState(() => {
        try {
          const cached = localStorage.getItem('hero_tracker_cache_v2');
          if (cached) return JSON.parse(cached).lineSettings?.token || '';
        } catch (e) {}
        return '';
      });

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      // 每次資料更新時自動同步至本機極速快取
      useEffect(() => {
        if (usersData) {
          try {
            localStorage.setItem('hero_tracker_cache_v2', JSON.stringify(usersData));
          } catch (e) {}
        }
      }, [usersData]);

      // 載入 Google 試算表最新資料（背景同步更新）
      const loadInitialData = async () => {
        if (!GAS_API_URL || GAS_API_URL.includes("AKfycbwYOUR_SCRIPT_ID")) {
          setFatalError(
            `【尚未設定 GAS 應用程式網址】\n` +
            `1. 請在試算表開啟「擴充功能」->「Apps Script」\n` +
            `2. 貼上 Code.gs 內容並點擊「部署」->「新增部署作業」\n` +
            `3. 選擇「網頁應用程式」，將存取權限設為「任何人 (Anyone)」\n` +
            `4. 複製產生的網址，填入 index.html 頂部的 GAS_API_URL！`
          );
          setLoading(false);
          return;
        }

        try {
          const res = await apiGet('initData');
          if (res && res.success && res.data) {
            setUsersData(res.data);
            try {
              localStorage.setItem('hero_tracker_cache_v2', JSON.stringify(res.data));
            } catch (e) {}
            setEditSettings({
              player1: { name: res.data.player1.name, pin: res.data.player1.pin },
              player2: { name: res.data.player2.name, pin: res.data.player2.pin }
            });
            setEditAdminPin(res.data.adminPin || '9999');
            setEditAdmin2Pin(res.data.admin2Pin || '8888');
            if (res.data.lineSettings) {
              setEditLineToken(res.data.lineSettings.token || '');
            }
            setLoading(false);
          } else {
            if (!localStorage.getItem('hero_tracker_cache_v2')) {
              setFatalError(`【資料載入失敗】\n${res?.error || '無法讀取 Google 試算表資料，請確認試算表是否有權限'}`);
            }
            setLoading(false);
          }
        } catch (err) {
          if (!localStorage.getItem('hero_tracker_cache_v2')) {
            setFatalError(`【連線失敗】\n無法連線至 Google Apps Script！\n請確認：\n1. 部署時「誰可以存取」是否已選擇「任何人 (Anyone)」\n2. 網址是否正確\n\n錯誤詳情：${err.message}`);
          }
          setLoading(false);
        }
      };

      useEffect(() => {
        loadInitialData();
      }, []);

      // 交換日記輕量輪詢：開啟信箱時每 5 秒更新，平時每 35 秒檢查一次
      useEffect(() => {
        if (!usersData || !GAS_API_URL || GAS_API_URL.includes("AKfycbwYOUR_SCRIPT_ID")) return;
        const intervalTime = (showDiary || adminTab === 'diary') ? 5000 : 35000;
        const timer = setInterval(async () => {
          try {
            const res = await apiGet('getDiary');
            if (res && res.success && res.data) {
              setUsersData(prev => {
                if (!prev) return prev;
                return {
                  ...prev,
                  player1: { ...prev.player1, diary: res.data.player1 || prev.player1.diary },
                  player2: { ...prev.player2, diary: res.data.player2 || prev.player2.diary }
                };
              });
            }
          } catch (e) {
            // 背景輕量輪詢失敗靜默處理
          }
        }, intervalTime);
        return () => clearInterval(timer);
      }, [showDiary, adminTab, usersData !== null]);

      useEffect(() => {
        if (showDiary || adminTab === 'diary') {
          setTimeout(() => { diaryEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, 150);
        }
      }, [showDiary, adminTab, adminTargetPlayer, usersData?.player1?.diary, usersData?.player2?.diary]);

      useEffect(() => {
        if (celebration.show) {
          const timer = setTimeout(() => { setCelebration(prev => ({ ...prev, show: false })); }, 2500); 
          return () => clearTimeout(timer);
        }
      }, [celebration.show]);

      // PIN 碼比對登入
      useEffect(() => {
        if (pinInput.length === 4 && usersData) {
          let isError = false;
          if (targetLogin === 'admin') { 
            if (pinInput === usersData.adminPin) { setCurrentUser('admin'); setView('admin'); } 
            else if (pinInput === usersData.admin2Pin) { setCurrentUser('admin2'); setView('admin'); }
            else { isError = true; }
          } 
          else {
            if (pinInput === usersData[targetLogin].pin) { setCurrentUser(targetLogin); setView('game'); } 
            else isError = true;
          }
          if (isError) alertTip(`密碼錯誤！`);
          setPinInput(''); setTargetLogin(null);
        }
      }, [pinInput, targetLogin, usersData]);

      const handleNumClick = (num) => { if (pinInput.length < 4) setPinInput(prev => prev + num); };

      // 手動換日
      const resetDay = () => {
        setConfirmDialog({
          message: '確定要結束今天，結算並產生明天的任務嗎？',
          onConfirm: async () => {
            alertTip('⏳ 正在結算資料並寫入試算表...');
            setConfirmDialog(null);
            try {
              const res = await apiPost({ action: 'manualResetDay' });
              if (res && res.success) {
                const refreshed = await apiGet('initData');
                if (refreshed && refreshed.success && refreshed.data) {
                  setUsersData(refreshed.data);
                  alertTip('✅ 明天任務產生完成！');
                }
              } else {
                alertTip(`換日失敗：${res?.error || '未知錯誤'}`);
              }
            } catch (e) {
              alertTip(`換日失敗：${e.message}`);
            }
          },
          onCancel: () => setConfirmDialog(null)
        });
      };

      // 管理員補登/修正歷史打卡紀錄
      const saveDayRecord = (uid, dateStr, newC, newT) => {
        const c = Math.max(0, parseInt(newC) || 0);
        const t = Math.max(1, parseInt(newT) || 1);
        const validatedC = Math.min(c, t);
        
        const newData = { ...usersData };
        if (!newData[uid].dailyRecords) newData[uid].dailyRecords = {};
        newData[uid].dailyRecords[dateStr] = { c: validatedC, t };
        setUsersData(newData);
        setEditingDayRecord(null);

        apiPost({
          action: 'updateHistoryRecord',
          uid: uid,
          dateStr: dateStr,
          completedCount: validatedC,
          totalCount: t
        }).then(res => {
          if (res && res.success) {
            alertTip(`✅ 已更新 ${dateStr} 的打卡紀錄！`);
          } else {
            alertTip(`更新失敗：${res?.error || '未知錯誤'}`);
          }
        }).catch(e => alertTip(`更新出錯：${e.message}`));
      };

      // 勇者打卡切換（樂觀更新 + 背景排隊鎖存檔）
      const toggleTask = (taskId) => {
        if (!usersData || !currentUser || celebration.show) return;
        const user = usersData[currentUser];
        const taskIndex = user.tasks.findIndex(t => t.id === taskId);
        if (taskIndex === -1) return;
        const task = user.tasks[taskIndex];
        const isCompleting = !task.completed;
        const newTasks = [...user.tasks];
        newTasks[taskIndex] = { ...task, completed: isCompleting };

        if (isCompleting) {
          setAnimatingTask(taskId); setTimeout(() => setAnimatingTask(null), 800);
          const remainingCount = newTasks.length - newTasks.filter(t => t.completed).length;
          const completedCount = newTasks.filter(t => t.completed).length;
          if (remainingCount === 0) setCelebration({ show: true, type: 'perfect', title: '🌟 完美達成 🌟', message: '太厲害了！你完成了今天所有的挑戰！' });
          else if (remainingCount <= 3) setCelebration({ show: true, type: 'countdown', title: '🔥 最後衝刺 🔥', message: `太棒了！只差最後 ${remainingCount} 個就能全數完成了！` });
          else if (completedCount % 5 === 0) setCelebration({ show: true, type: 'milestone', title: '✨ 恭喜達成 ✨', message: `連續突破！已經完成 ${completedCount} 個任務囉！` });
        }
        
        const pointsDiff = isCompleting ? 1 : -1;
        const newPoints = Math.max(0, user.points + pointsDiff);
        const newData = { ...usersData, [currentUser]: { ...user, tasks: newTasks, points: newPoints } };
        setUsersData(newData);

        // 背景存檔至 GAS
        apiPost({
          action: 'toggleTask',
          uid: currentUser,
          taskId: taskId,
          completed: isCompleting,
          pointsDiff: pointsDiff
        }).catch(err => alertTip(`存檔提醒：${err.message}`));
      };

      // 管理處補蓋章
      const adminToggleTask = (uid, taskId) => {
        if (!usersData) return;
        const user = usersData[uid];
        const taskIndex = user.tasks.findIndex(t => t.id === taskId);
        if (taskIndex === -1) return;
        const task = user.tasks[taskIndex];
        const isCompleting = !task.completed;
        const newTasks = [...user.tasks];
        newTasks[taskIndex] = { ...task, completed: isCompleting };
        const pointsDiff = isCompleting ? 1 : -1;
        const newPoints = Math.max(0, user.points + pointsDiff);
        const newData = { ...usersData, [uid]: { ...user, tasks: newTasks, points: newPoints } };
        setUsersData(newData);
        
        apiPost({
          action: 'toggleTask',
          uid: uid,
          taskId: taskId,
          completed: isCompleting,
          pointsDiff: pointsDiff
        }).catch(err => alertTip(`補蓋存檔失敗：${err.message}`));

        alertTip(`🛠️ 已${isCompleting ? '補蓋' : '取消'}「${task.title}」`);
      };

      // 發送交換日記留言
      const handleSendDiary = (senderId, targetUid) => {
        if (!diaryInput.trim()) return;
        const uid = targetUid || currentUser;
        if (!uid) return;
        const text = diaryInput.trim();
        const tempId = 'temp_' + Date.now();
        const now = Date.now();
        const newMessage = { id: tempId, sender: senderId, text: text, timestamp: now };
        const currentDiary = usersData[uid]?.diary || [];
        const newData = { ...usersData, [uid]: { ...usersData[uid], diary: [...currentDiary, newMessage] } };
        setUsersData(newData);
        setDiaryInput('');
        setTimeout(() => { diaryEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, 100);

        apiPost({
          action: 'sendDiary',
          uid: uid,
          sender: senderId,
          text: text
        }).then(res => {
          if (res && res.success && res.message) {
            setUsersData(prev => {
              if (!prev) return prev;
              const updated = (prev[uid]?.diary || []).map(m => m.id === tempId ? res.message : m);
              return { ...prev, [uid]: { ...prev[uid], diary: updated } };
            });
          }
        }).catch(err => alertTip(`留言送出失敗：${err.message}`));
      };

      // 自由刪除留言（隨時自由刪除任意留言，不再有 5 分鐘限制）
      const deleteDiaryMsg = (uid, msgId) => {
        const msg = usersData[uid].diary.find(m => m.id === msgId);
        if (!msg) return;

        setConfirmDialog({
          message: '確定要刪除這條留言嗎？',
          onConfirm: () => {
            const newDiary = usersData[uid].diary.filter(m => m.id !== msgId);
            const newData = { ...usersData, [uid]: { ...usersData[uid], diary: newDiary } };
            setUsersData(newData);
            apiPost({ action: 'deleteDiary', uid, msgId }).catch(e => console.error(e));
            setConfirmDialog(null);
            alertTip('🗑️ 留言已刪除');
          },
          onCancel: () => setConfirmDialog(null)
        });
      };

      // 派發新常駐任務
      const handleAddPersonalTask = () => {
        if (!newTaskForm.title.trim()) return alertTip('請輸入任務名稱');
        const targetUids = taskTargetMode === 'both' ? ['player1', 'player2'] : [taskTargetMode];
        if (newTaskForm.freqType === 'weekly' && newTaskForm.freqWeekly.length === 0) {
          return alertTip('請至少勾選一天');
        }

        const payload = {
          action: 'addPersonalTask',
          uids: targetUids,
          title: newTaskForm.title.trim(),
          freqType: newTaskForm.freqType,
          freqValue: newTaskForm.freqType === 'weekly' ? newTaskForm.freqWeekly.join(',') : (parseInt(newTaskForm.freqValue) || 1)
        };

        apiPost(payload).then(async () => {
          const refreshed = await apiGet('initData');
          if (refreshed && refreshed.success && refreshed.data) setUsersData(refreshed.data);
          setNewTaskForm({ title: '', freqType: 'daily', freqValue: 2, freqWeekly: [] }); 
          alertTip(taskTargetMode === 'both' ? '✅ 已同時加入兩人的任務！' : '✅ 新任務已加入！');
        }).catch(e => alertTip(`新增任務失敗：${e.message}`));
      };

      // 刪除常駐任務
      const handleDeletePersonalTask = (uid, taskId) => {
        setConfirmDialog({
          message: '確定要刪除這個任務嗎？',
          onConfirm: () => {
            const newData = { ...usersData };
            newData[uid].personalTasks = newData[uid].personalTasks.filter(t => t.id !== taskId);
            newData[uid].tasks = newData[uid].tasks.filter(t => t.id !== taskId);
            setUsersData(newData);
            apiPost({ action: 'deletePersonalTask', uid, taskId }).catch(e => alertTip(`刪除失敗：${e.message}`));
            setConfirmDialog(null);
            alertTip('🗑️ 任務已刪除');
          },
          onCancel: () => setConfirmDialog(null)
        });
      };

      // 派發新評量
      const handleAddAssessment = () => {
        if (!newAssessmentForm.title.trim()) return alertTip('請輸入評量名稱！');
        if (newAssessmentForm.count < 1) return alertTip('評量數量必須大於 0！');

        const targetUids = assessmentTargetMode === 'both' ? ['player1', 'player2'] : [assessmentTargetMode];
        const payload = {
          action: 'addAssessment',
          uids: targetUids,
          title: newAssessmentForm.title.trim(),
          reason: newAssessmentForm.reason.trim(),
          count: parseInt(newAssessmentForm.count)
        };

        apiPost(payload).then(async () => {
          const refreshed = await apiGet('initData');
          if (refreshed && refreshed.success && refreshed.data) setUsersData(refreshed.data);
          setNewAssessmentForm({ title: '', reason: '', count: 1 });
          alertTip(assessmentTargetMode === 'both' ? '📚 已派發評量給兩位勇者！' : '📚 評量已派發！');
        }).catch(e => alertTip(`派發失敗：${e.message}`));
      };

      // 刪除評量
      const handleDeleteAssessment = (uid, assId) => {
        setConfirmDialog({
          message: '確定要直接刪除這個評量嗎？',
          onConfirm: () => {
            const newData = { ...usersData };
            newData[uid].assessments = (newData[uid].assessments || []).filter(a => a.id !== assId);
            setUsersData(newData);
            apiPost({ action: 'deleteAssessment', assId }).catch(e => alertTip(`刪除失敗：${e.message}`));
            setConfirmDialog(null);
            alertTip('🗑️ 評量已刪除');
          },
          onCancel: () => setConfirmDialog(null)
        });
      };

      // 勇者回報評量
      const handleReportAssessment = (uid, assId) => {
        if (!usersData || celebration.show) return;
        const user = usersData[uid];
        const ass = user.assessments.find(a => a.id === assId);
        if (!ass) return;
        
        if (ass.count - (ass.reportedCount || 0) <= 0) {
          return alertTip('⏳ 已經回報過了，請等待審核！');
        }

        setConfirmDialog({
          message: `確定要向管理處回報完成 1 次「${ass.title}」嗎？\n(需等待確認後才會發放 EXP)`,
          onConfirm: () => {
            const newData = { ...usersData };
            const targetAss = newData[uid].assessments.find(a => a.id === assId);
            targetAss.reportedCount = (targetAss.reportedCount || 0) + 1;
            setUsersData(newData);
            apiPost({ action: 'reportAssessment', assId }).catch(e => alertTip(`回報失敗：${e.message}`));
            setConfirmDialog(null);
            alertTip('📩 已送出回報，等待確認！');
          },
          onCancel: () => setConfirmDialog(null)
        });
      };

      // 管理處認可評量
      const approveAssessmentReport = (uid, assId) => {
        const newData = { ...usersData };
        const user = newData[uid];
        const idx = user.assessments.findIndex(a => a.id === assId);
        if (idx > -1) {
          user.assessments[idx].reportedCount = Math.max(0, user.assessments[idx].reportedCount - 1);
          user.assessments[idx].count -= 1;
          user.points += 3;
          if (user.assessments[idx].count <= 0) {
            user.assessments.splice(idx, 1);
          }
          setUsersData(newData);
          apiPost({ action: 'approveAssessment', uid, assId }).catch(e => alertTip(`認可失敗：${e.message}`));
          alertTip('✅ 已確認完成，發放 +3 EXP！');
        }
      };

      // 管理處退回評量
      const rejectAssessmentReport = (uid, assId) => {
        const newData = { ...usersData };
        const user = newData[uid];
        const idx = user.assessments.findIndex(a => a.id === assId);
        if (idx > -1) {
          user.assessments[idx].reportedCount = Math.max(0, user.assessments[idx].reportedCount - 1);
          setUsersData(newData);
          apiPost({ action: 'rejectAssessment', assId }).catch(e => alertTip(`退回失敗：${e.message}`));
          alertTip('❌ 已退回該次回報');
        }
      };

      // 📜 家規公告相關操作與簽署邏輯
      const isRuleAgreedByUser = (uid, rule) => {
        if (!usersData || !usersData.ruleAgreements || !usersData.ruleAgreements[uid] || !rule) return false;
        const ag = usersData.ruleAgreements[uid][rule.id];
        return ag && ag.agreedVersion === rule.version;
      };

      const getAgreedRulesCount = (uid) => {
        if (!usersData || !usersData.houseRules) return 0;
        return usersData.houseRules.filter(r => isRuleAgreedByUser(uid, r)).length;
      };

      const hasUnsignedRules = (() => {
        if (!usersData || !usersData.houseRules || usersData.houseRules.length === 0) return false;
        if (!currentUser || !['player1', 'player2'].includes(currentUser)) return false;
        return usersData.houseRules.some(r => !isRuleAgreedByUser(currentUser, r));
      })();

      // 勇者勾選同意單一條款
      const handleAgreeRule = async (ruleId, ruleVersion) => {
        if (!currentUser || !['player1', 'player2'].includes(currentUser)) return;
        const now = Date.now();
        // 樂觀更新
        setUsersData(prev => {
          if (!prev) return prev;
          const newAgreements = { ...(prev.ruleAgreements || {}) };
          if (!newAgreements[currentUser]) newAgreements[currentUser] = {};
          newAgreements[currentUser] = {
            ...newAgreements[currentUser],
            [ruleId]: { agreedVersion: ruleVersion, signTime: now }
          };
          return { ...prev, ruleAgreements: newAgreements };
        });

        try {
          const res = await apiPost({
            action: 'agreeHouseRule',
            uid: currentUser,
            ruleId: ruleId,
            version: ruleVersion
          });
          if (res && res.success) {
            alertTip('✅ 已簽署同意該條款！');
          } else {
            alertTip(`簽署未完成：${res?.error || '請稍後重試'}`);
          }
        } catch (e) {
          alertTip(`簽署出錯：${e.message}`);
        }
      };

      // 勇者一鍵簽署全部條款
      const handleAgreeAllRules = async () => {
        if (!currentUser || !['player1', 'player2'].includes(currentUser) || !usersData?.houseRules) return;
        const now = Date.now();
        const rulesToSign = usersData.houseRules.map(r => ({ id: r.id, version: r.version }));
        // 樂觀更新
        setUsersData(prev => {
          if (!prev) return prev;
          const newAgreements = { ...(prev.ruleAgreements || {}) };
          if (!newAgreements[currentUser]) newAgreements[currentUser] = {};
          const userMap = { ...newAgreements[currentUser] };
          rulesToSign.forEach(r => {
            userMap[r.id] = { agreedVersion: r.version, signTime: now };
          });
          newAgreements[currentUser] = userMap;
          return { ...prev, ruleAgreements: newAgreements };
        });

        try {
          const res = await apiPost({
            action: 'agreeAllHouseRules',
            uid: currentUser,
            rules: rulesToSign
          });
          if (res && res.success) {
            alertTip('🌟 已完成全部家規條款簽署同意！');
          } else {
            alertTip(`簽署出錯：${res?.error || '未知錯誤'}`);
          }
        } catch (e) {
          alertTip(`簽署失敗：${e.message}`);
        }
      };

      // 管理員新增家規
      const handleAddHouseRule = async () => {
        if (!newRuleForm.title.trim()) return alertTip('請輸入家規標題！');
        if (!newRuleForm.content.trim()) return alertTip('請輸入家規內容！');
        setSavingRule(true);
        try {
          const res = await apiPost({
            action: 'addHouseRule',
            title: newRuleForm.title.trim(),
            content: newRuleForm.content.trim()
          });
          if (res && res.success) {
            const refreshed = await apiGet('initData');
            if (refreshed && refreshed.success && refreshed.data) {
              setUsersData(refreshed.data);
            }
            setNewRuleForm({ title: '', content: '' });
            alertTip('📜 已新增家規條款，並自動發布置頂提醒公告！');
          } else {
            alertTip(`新增失敗：${res?.error || '未知錯誤'}`);
          }
        } catch (e) {
          alertTip(`新增出錯：${e.message}`);
        } finally {
          setSavingRule(false);
        }
      };

      // 管理員儲存修改家規
      const handleSaveEditHouseRule = () => {
        if (!editingRule || !editingRule.title.trim()) return alertTip('請輸入條款標題！');
        if (!editingRule.content.trim()) return alertTip('請輸入條款內容！');
        setConfirmDialog({
          message: `確定要儲存修改「${editingRule.title}」嗎？\n\n⚠️ 注意：內容修改後，所有勇者對此條款的同意狀態將重置，必須重新閱讀並勾選同意，系統也會自動發布置頂公告提醒！`,
          onConfirm: async () => {
            setConfirmDialog(null);
            setSavingRule(true);
            try {
              const res = await apiPost({
                action: 'updateHouseRule',
                ruleId: editingRule.id,
                title: editingRule.title.trim(),
                content: editingRule.content.trim()
              });
              if (res && res.success) {
                const refreshed = await apiGet('initData');
                if (refreshed && refreshed.success && refreshed.data) {
                  setUsersData(refreshed.data);
                }
                setEditingRule(null);
                alertTip('✅ 條款已更新！已重置簽署狀態並發布提醒公告！');
              } else {
                alertTip(`更新失敗：${res?.error || '未知錯誤'}`);
              }
            } catch (e) {
              alertTip(`更新出錯：${e.message}`);
            } finally {
              setSavingRule(false);
            }
          },
          onCancel: () => setConfirmDialog(null)
        });
      };

      // 管理員刪除家規
      const handleDeleteHouseRule = (ruleId, title) => {
        setConfirmDialog({
          message: `確定要刪除家規「${title}」嗎？\n刪除後該條款將從所有勇者介面移除。`,
          onConfirm: async () => {
            setConfirmDialog(null);
            try {
              const res = await apiPost({
                action: 'deleteHouseRule',
                ruleId: ruleId
              });
              if (res && res.success) {
                setUsersData(prev => {
                  if (!prev) return prev;
                  return {
                    ...prev,
                    houseRules: (prev.houseRules || []).filter(r => r.id !== ruleId)
                  };
                });
                alertTip('🗑️ 家規條款已刪除！');
              } else {
                alertTip(`刪除失敗：${res?.error || '未知錯誤'}`);
              }
            } catch (e) {
              alertTip(`刪除出錯：${e.message}`);
            }
          },
          onCancel: () => setConfirmDialog(null)
        });
      };

      // 管理員手動刷新置頂家規提醒公告
      const handleTriggerRulesNotice = async () => {
        try {
          const res = await apiPost({ action: 'triggerHouseRulesAnnouncement' });
          if (res && res.success) {
            const refreshed = await apiGet('initData');
            if (refreshed && refreshed.success && refreshed.data) {
              setUsersData(refreshed.data);
            }
            alertTip('📢 已成功刷新置頂家規提醒公告！');
          }
        } catch (e) {
          alertTip(`刷新公告失敗：${e.message}`);
        }
      };

      // 📜 常駐公告告示牌（含家規未簽署醒目提醒）
      const KnowledgeSign = () => {
        const marqueeList = (usersData && usersData.marquee && usersData.marquee.length > 0)
          ? usersData.marquee
          : [];

        const unSignedNotice = hasUnsignedRules && ['player1', 'player2'].includes(currentUser) && (
          <div 
            onClick={() => setShowHouseRules(true)} 
            className="bg-[#c62828] hover:bg-[#b71c1c] text-white p-2.5 px-3 mb-2.5 border-4 border-[#ef5350] flex items-center justify-between cursor-pointer transition-transform active:scale-[0.98] shadow-lg animate-pulse select-none"
          >
            <div className="flex items-center gap-2">
              <span className="text-xl">📜⚠️</span>
              <span className="text-xs md:text-sm font-bold tracking-wide">
                【家規更新提醒】家規條款有新增或修改！您尚有未同意的條款，請立即點此簽署！
              </span>
            </div>
            <span className="bg-[#ffeb3b] text-[#3e2723] px-2.5 py-1 text-xs font-black shrink-0 border border-[#f57f17] shadow-sm ml-2">
              前往簽署 ➔
            </span>
          </div>
        );

        // 若無任何自訂公告，顯示內建每日知識/節氣
        if (marqueeList.length === 0) {
          return (
            <div className="mb-3 shrink-0">
              {unSignedNotice}
              <div className="mc-sign p-2 px-3 shadow-sm flex items-center shrink-0 border-2 gap-2.5">
                <div className="shrink-0 bg-[#8f6736] text-[#ebd197] px-2 py-0.5 text-[10px] md:text-xs font-bold border border-[#ebd197] shadow-inner">
                  本日{todayKnowledge.tag}
                </div>
                <div className="flex-1 text-xs md:text-sm font-bold text-[#3e2723] leading-snug">
                  <span className="font-extrabold text-[#1f1f1f]">[{todayKnowledge.title}]</span> {todayKnowledge.content}
                </div>
              </div>
            </div>
          );
        }

        // 若只有 1 則公告
        if (marqueeList.length === 1) {
          const item = marqueeList[0];
          const isHouseRuleNotice = (item.tag === '家規' || String(item.title).includes('家規'));
          return (
            <div className="mb-3 shrink-0">
              {unSignedNotice}
              <div 
                onClick={() => { if (isHouseRuleNotice) setShowHouseRules(true); }}
                className={`mc-sign p-2 px-3 shadow-sm flex items-center shrink-0 border-2 gap-2.5 ${isHouseRuleNotice ? 'cursor-pointer hover:border-[#4dd0e1]' : ''}`}
              >
                <div className="shrink-0 bg-[#8f6736] text-[#ebd197] px-2 py-0.5 text-[10px] md:text-xs font-bold border border-[#ebd197] shadow-inner">
                  本日{item.tag || '公告'}
                </div>
                <div className="flex-1 text-xs md:text-sm font-bold text-[#3e2723] leading-snug">
                  <span className="font-extrabold text-[#1f1f1f]">[{item.title}]</span> {item.content}
                  {isHouseRuleNotice && <span className="text-[#006064] text-xs font-extrabold ml-1 underline">[查看]</span>}
                </div>
              </div>
            </div>
          );
        }

        // 若有多則公告，整齊條列常駐顯示
        return (
          <div className="mb-3 shrink-0">
            {unSignedNotice}
            <div className="mc-sign p-2 px-3 shadow-sm shrink-0 border-2 space-y-1.5">
              {marqueeList.map((item, idx) => {
                const isHouseRuleNotice = (item.tag === '家規' || String(item.title).includes('家規'));
                return (
                  <div 
                    key={idx} 
                    onClick={() => { if (isHouseRuleNotice) setShowHouseRules(true); }}
                    className={`flex items-baseline gap-2 border-b border-[#8f6736]/30 last:border-none pb-1 last:pb-0 ${isHouseRuleNotice ? 'cursor-pointer hover:bg-black/5 rounded p-0.5' : ''}`}
                  >
                    <span className="shrink-0 bg-[#8f6736] text-[#ebd197] px-1.5 py-0.2 text-[10px] md:text-xs font-bold border border-[#ebd197] shadow-inner">
                      {item.tag || '公告'}
                    </span>
                    <div className="flex-1 text-xs md:text-sm font-bold text-[#3e2723] leading-snug break-words">
                      <span className="font-extrabold text-[#1f1f1f]">[{item.title}]</span> {item.content}
                      {isHouseRuleNotice && <span className="text-[#006064] text-xs font-extrabold ml-1 underline">[點擊查看]</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      const TopBar = () => (
        <div className="absolute top-2 left-2 md:top-4 md:left-4 flex items-center gap-3 z-10">
          <span className="text-xs text-gray-500 font-bold hidden md:inline">{SYSTEM_VERSION}</span>
          <button onClick={() => setShowChangelog(true)} className="text-xs text-[#4dd0e1] hover:text-white underline">[更新日誌]</button>
        </div>
      );

      // 聊天室/交換日記渲染
      const renderDiaryChat = (uid) => {
        const msgs = usersData[uid]?.diary || [];
        return (
          <div className="flex flex-col h-full bg-[#1e1e1e] relative">
            <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4 flex flex-col">
              {msgs.length === 0 && <p className="text-gray-500 text-center text-sm mt-10">目前還沒有留言喔，寫點東西吧！</p>}
              {msgs.map(m => {
                const isMe = m.sender === currentUser;
                const isAdmin = currentUser === 'admin' || currentUser === 'admin2';
                // 自由刪除：勇者可刪除自己的留言，管理員可刪除任意留言
                const canDelete = isMe || isAdmin; 
                
                let senderName = usersData[uid].name;
                if (m.sender === 'admin') senderName = '👑 村長';
                if (m.sender === 'admin2') senderName = '🤴 國王';

                return (
                  <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                    <div className="flex items-center gap-2 mb-1 px-1">
                      <span className="text-[10px] md:text-xs text-gray-400 font-bold">
                        {senderName} • {new Date(m.timestamp).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
                      </span>
                      {canDelete && (
                        <button onClick={() => deleteDiaryMsg(uid, m.id)} className="text-red-400 hover:text-red-300 text-xs px-1 bg-black/30 rounded border border-gray-600 cursor-pointer transition-transform active:scale-90">
                          [❌刪除]
                        </button>
                      )}
                    </div>
                    <div className={`p-2 px-3 max-w-[85%] border-2 break-words font-bold leading-relaxed text-sm md:text-base shadow-sm ${isMe ? 'bg-[#388e3c] border-[#81c784] text-white rounded-tl-lg rounded-br-lg rounded-bl-lg' : 'bg-[#5e5e5e] border-[#a4a4a4] text-white rounded-tr-lg rounded-br-lg rounded-bl-lg'}`}>
                      {m.text}
                    </div>
                  </div>
                )
              })}
              <div ref={diaryEndRef} className="h-1" />
            </div>
            <div className="shrink-0 bg-[#2b2b2b] border-t-4 border-[#1f1f1f] p-2 flex gap-2">
              <input type="text" value={diaryInput} onChange={e => setDiaryInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSendDiary(currentUser, uid)} placeholder="輸入留言..." className="mc-input flex-1 font-bold text-sm" />

                  </div>
                  <div className="grid grid-cols-7 gap-1 text-center mb-2 font-bold text-gray-400"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
                  <div className="grid grid-cols-7 gap-1 text-center text-sm">
                    {Array.from({ length: new Date(new Date().getFullYear(), new Date().getMonth() + calMonthOffset, 1).getDay() }).map((_, i) => <div key={`b-${i}`} className="p-2"></div>)}
                    {Array.from({ length: new Date(new Date().getFullYear(), new Date().getMonth() + calMonthOffset + 1, 0).getDate() }, (_, i) => i + 1).map(d => {
                      const targetYear = new Date(new Date().setMonth(new Date().getMonth() + calMonthOffset)).getFullYear();
                      const targetMonth = String(new Date(new Date().setMonth(new Date().getMonth() + calMonthOffset)).getMonth() + 1).padStart(2, '0');
                      const dStr = `${targetYear}-${targetMonth}-${String(d).padStart(2,'0')}`;
                      let record = user.dailyRecords[dStr];
                      if (dStr === TODAY_STR) { if (completedCount > 0 || record) record = { c: completedCount, t: totalCount }; }
                      let stamp = ''; let bgClass = 'bg-[#3b3b3b] border-[#1f1f1f]'; 
                      if (record && record.c > 0) {
                        const ratio = record.c / record.t;
                        if (ratio === 1) { stamp = '🌟'; bgClass = 'bg-[#fbc02d]/40 border-[#f57f17]/50'; } 
                        else if (ratio >= 0.5) { stamp = '🟢'; bgClass = 'bg-[#4caf50]/40 border-[#2e7d32]/50'; } 
                        else { stamp = '⭕'; bgClass = 'bg-[#e53935]/40 border-[#b71c1c]/50'; }
                      } else if (dStr === TODAY_STR) bgClass = 'bg-[#00bcd4]/40 border-[#006064] shadow-[0_0_8px_rgba(0,188,212,0.6)]';
                      return (<div key={d} className={`flex flex-col items-center justify-center border-2 p-1 aspect-square relative ${bgClass}`}><span className="text-[10px] text-gray-300 absolute top-0.5 left-1 font-bold">{d}</span><span className="text-lg md:text-xl mt-3">{stamp}</span></div>);
                    })}
                  </div>
                </div>
                <button onClick={() => {setShowCalendar(false); setCalMonthOffset(0);}} className="mc-button mc-wood w-full mt-6 py-2 font-bold shrink-0">返回</button>
              </div>
            </div>
          )}

          {showDiary && (
            <div className={`fixed inset-0 bg-black/90 z-[100] flex flex-col`}>
              <div className="flex justify-between items-center p-3 bg-[#3b3b3b] border-b-4 border-[#1f1f1f] shrink-0 shadow-lg">
                <h2 className="text-lg md:text-xl text-yellow-300 font-bold tracking-wider" style={{textShadow: '2px 2px 0 #000'}}>📓 交換日記</h2>
                <button onClick={() => setShowDiary(false)} className="text-gray-300 text-2xl font-bold px-2">✕</button>
              </div>
              <div className="flex-1 overflow-hidden bg-[#1e1e1e]">
                {renderDiaryChat(currentUser)}
              </div>
            </div>
          )}

          {showHouseRules && (
            <div className="fixed inset-0 bg-black/85 z-[100] flex items-center justify-center p-3 pixel-font">
              <div className="mc-panel p-4 md:p-6 w-full max-w-2xl flex flex-col max-h-[92vh] overflow-hidden">
                {/* 標題欄 */}
                <div className="flex justify-between items-center mb-3 border-b-4 border-[#1f1f1f] pb-2 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📜</span>
                    <h2 className="text-lg md:text-xl text-yellow-300 font-bold" style={{textShadow: '2px 2px 0 #000'}}>
                      勇者家規公告守則
                    </h2>
                  </div>
                  <button onClick={() => setShowHouseRules(false)} className="text-gray-300 hover:text-white text-2xl font-bold px-2">✕</button>
                </div>

                {/* 說明橫幅 */}
                <div className="mc-sign p-2 px-3 mb-3 text-xs md:text-sm font-bold shrink-0 border-2">
                  🛡️ 身為合格的勇者，必須遵守家園與冒險守則！請仔細閱讀以下各項條款，並逐條勾選同意。條款若有增修，需重新完成簽署。
                </div>

                {/* 簽署進度條 */}
                <div className="flex items-center justify-between mb-2 px-1 shrink-0">
                  <span className="text-xs font-bold text-gray-300">
                    簽署進度：
                    <span className={getAgreedRulesCount(currentUser) === (usersData?.houseRules?.length || 0) && (usersData?.houseRules?.length || 0) > 0 ? "text-[#81c784] font-extrabold ml-1" : "text-yellow-400 font-extrabold ml-1"}>
                      {getAgreedRulesCount(currentUser)} / {usersData?.houseRules?.length || 0} 條
                    </span>
                  </span>
                  {getAgreedRulesCount(currentUser) === (usersData?.houseRules?.length || 0) && (usersData?.houseRules?.length || 0) > 0 && (
                    <span className="text-xs text-[#81c784] font-bold bg-[#1b5e20] px-2 py-0.5 border border-[#81c784]">
                      🌟 已全數簽署同意
                    </span>
                  )}
                </div>

                {/* 條款清單 (滾動區) */}
                <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-3">
                  {(!usersData?.houseRules || usersData.houseRules.length === 0) ? (
                    <div className="text-center text-gray-400 py-10 font-bold">目前沒有設定任何家規條款！</div>
                  ) : (
                    usersData.houseRules.map((rule, idx) => {
                      const isAgreed = isRuleAgreedByUser(currentUser, rule);
                      const signInfo = usersData.ruleAgreements?.[currentUser]?.[rule.id];
                      return (
                        <div 
                          key={rule.id}
                          className={`p-3 border-4 transition-all ${isAgreed ? 'bg-[#2e3b2e] border-[#4caf50]/60' : 'bg-[#3b2b2b] border-[#e53935]/80 shadow-md'}`}
                        >
                          <div className="flex justify-between items-start gap-2 mb-2">
                            <div className="flex items-center gap-2">
                              <span className="bg-[#111] text-yellow-300 px-2 py-0.5 text-xs font-extrabold border border-[#555]">
                                第 {idx + 1} 條
                              </span>
                              <h3 className="text-base md:text-lg font-bold text-white tracking-wide">
                                {rule.title}
                              </h3>
                            </div>
                            {isAgreed ? (
                              <span className="shrink-0 text-[10px] md:text-xs text-[#81c784] font-bold bg-[#1b5e20] px-2 py-0.5 border border-[#4caf50]">
                                ✓ 已同意
                              </span>
                            ) : (
                              <span className="shrink-0 text-[10px] md:text-xs text-yellow-300 font-bold bg-[#b71c1c] px-2 py-0.5 border border-[#ef5350] animate-pulse">
                                ⚠️ 待簽署
                              </span>
                            )}
                          </div>

                          <div className="text-sm md:text-base text-gray-200 font-bold leading-relaxed whitespace-pre-line bg-black/40 p-2.5 border-2 border-[#555] mb-3">
                            {rule.content}
                          </div>

                          <div className="flex flex-wrap justify-between items-center gap-2 pt-1 border-t border-white/10">
                            <span className="text-[11px] text-gray-400 font-bold">
                              最後更新：{new Date(rule.updatedAt).toLocaleDateString('zh-TW')}
                              {isAgreed && signInfo?.signTime && ` • 簽署於 ${new Date(signInfo.signTime).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`}
                            </span>

                            <button
                              onClick={() => handleAgreeRule(rule.id, rule.version)}
                              className={`mc-button px-3 py-1.5 text-xs md:text-sm font-bold flex items-center gap-1.5 ${isAgreed ? 'mc-grass' : 'mc-gold text-[#3e2723]'}`}
                            >
                              <span className="text-base">{isAgreed ? '✅' : '⬜'}</span>
                              <span>{isAgreed ? '已簽署同意' : '我已閱讀並同意此條款'}</span>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                {/* 底部按鈕欄 */}
                <div className="flex justify-between items-center gap-2 mt-3 pt-3 border-t-4 border-[#1f1f1f] shrink-0">
                  {usersData?.houseRules && usersData.houseRules.length > 0 && !hasUnsignedRules ? (
                    <div className="text-xs text-[#81c784] font-bold">
                      🎉 勇者誓約已生效，做個恪守公約的優秀勇者！
                    </div>
                  ) : (
                    <button
                      onClick={handleAgreeAllRules}
                      className="mc-button mc-diamond px-3 py-2 text-xs md:text-sm font-bold shadow-md"
                    >
                      ✍️ 一鍵同意全部條款
                    </button>
                  )}
                  <button onClick={() => setShowHouseRules(false)} className="mc-button mc-wood px-6 py-2 text-xs md:text-sm font-bold">
                    關閉
                  </button>
                </div>
              </div>
            </div>
          )}

          {celebration.show && (
            <div onClick={() => setCelebration(prev => ({ ...prev, show: false }))} className={`fixed inset-0 bg-black/70 flex items-center justify-center z-[110] p-4 backdrop-blur-sm cursor-pointer`}>
              <div className="relative overflow-hidden mc-panel p-6 w-[90%] max-w-md text-center celebrate-pop border-yellow-400 bg-[#3e2723] shadow-[0_0_50px_rgba(253,224,71,0.4)]">
                <div className="spin-glow"></div>
                <div className="relative z-10">
                  {celebration.type === 'perfect' && <div className="text-6xl mb-4 animate-bounce">🌟🌟🌟</div>}
                  {celebration.type === 'countdown' && <div className="text-6xl mb-4 animate-bounce">🔥🏃</div>}
                  {celebration.type === 'milestone' && <div className="text-6xl mb-4 animate-bounce">✨🎉</div>}
                  <h2 className="text-2xl md:text-3xl text-yellow-300 mb-4 font-bold" style={{textShadow: '3px 3px 0 #000'}}>{celebration.title}</h2>
                  <p className="text-lg md:text-xl text-white font-bold leading-relaxed">{celebration.message}</p>
                </div>
              </div>
            </div>
          )}
          
          <div className={`flex-1 overflow-y-auto p-2 pb-6 max-w-4xl mx-auto w-full flex flex-col`}>
            
            <KnowledgeSign />

            <div className="mc-panel p-3 mb-3 flex flex-row justify-between items-center gap-2 bg-[#2b2b2b] shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 bg-[#00bcd4] border-4 border-[#4dd0e1] border-b-[#006064] border-r-[#006064] flex items-center justify-center font-bold text-lg shrink-0 shadow-inner text-white" style={{textShadow: '2px 2px 0 #006064'}}>{avatarText}</div>
                <div><h2 className="text-lg text-yellow-300 font-bold" style={{textShadow: '2px 2px 0 #000'}}>{user.name}</h2><p className="text-xs text-[#4dd0e1] font-bold">Lv.{Math.floor(user.points / 10) + 1} | 總 EXP: {user.points}</p></div>
              </div>
              <button onClick={() => {setCurrentUser(null); setView('login');}} className="mc-button mc-redstone px-3 py-1 font-bold text-xs shrink-0">登出</button>
            </div>

            {(user.assessments && user.assessments.length > 0) && (
              <div className="mc-panel p-3 bg-[#2b2b2b] flex flex-col shrink-0 shadow-xl mb-3 border-yellow-600">
                <h3 className="text-sm md:text-base text-[#ffb74d] mb-3 border-b-4 border-[#1f1f1f] pb-2 flex justify-between items-end font-bold">
                  <span>📚 待完成評量</span>
                  <span className="text-[10px] text-gray-400">完成將獲得高額 EXP</span>
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {user.assessments.map(a => (
                    <div key={a.id} onClick={() => handleReportAssessment(currentUser, a.id)} className="relative mc-button mc-wood min-h-[70px] p-3 flex flex-col justify-center items-start text-left overflow-hidden">
                      <div className="flex justify-between w-full items-start mb-1">
                         <span className="text-base font-bold text-white leading-tight pr-2">{a.title}</span>
                         <div className="flex flex-col items-end gap-1">
                           <span className="bg-[#e53935] text-white px-2 py-0.5 border-2 border-[#ffcdd2] text-xs font-bold shrink-0 shadow-sm">剩 {a.count} 次</span>
                           {(a.reportedCount > 0) && <span className="bg-[#fbc02d] text-[#3e2723] px-2 py-0.5 border-2 border-[#fff59d] text-[10px] font-bold shrink-0 shadow-sm animate-pulse">審核中 x{a.reportedCount}</span>}
                         </div>
                      </div>
                      {a.reason && <div className="text-xs text-yellow-200 font-bold bg-black/40 p-1 w-full border border-[#5c3a18] mt-1 line-clamp-2">{a.reason}</div>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="mc-panel p-3 bg-[#2b2b2b] flex flex-col flex-1 shadow-xl">
              <h3 className="text-sm md:text-base text-[#81c784] mb-3 border-b-4 border-[#1f1f1f] pb-2 flex justify-between items-end shrink-0 font-bold">
                <span>🎴 日常挑戰</span>
                <span className="text-[10px] text-gray-400">點擊完成 +1 EXP</span>
              </h3>
              
              {totalCount === 0 ? (
                <div className="flex-1 flex items-center justify-center text-gray-500 font-bold text-lg">今天沒有任務！太棒了！</div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 flex-1 items-start content-start">
                  {user.tasks.map(task => (
                    <div key={task.id} onClick={() => toggleTask(task.id)} className={`relative mc-button min-h-[80px] md:min-h-[100px] flex flex-col items-center justify-center p-2 transition-all duration-100 select-none overflow-hidden ${task.completed ? 'mc-grass scale-95 opacity-80' : 'mc-wood'}`}>
                      {task.completed && <div className="absolute inset-0 flex items-center justify-center card-check-anim pointer-events-none"><span className="text-[50px] md:text-[70px] text-white opacity-40">✓</span></div>}
                      <span className={`relative z-10 text-[14px] md:text-[16px] font-bold text-center leading-snug px-1 ${task.completed ? 'text-[#1b5e20]' : 'text-white'}`}>{task.title}</span>
                      {animatingTask === task.id && <div className="exp-float font-bold text-sm">+1 EXP</div>}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className={`shrink-0 bg-[#2b2b2b] border-t-4 border-[#1f1f1f] p-3 z-40 shadow-[0_-10px_20px_rgba(0,0,0,0.8)]`}>
            <div className="max-w-4xl mx-auto flex flex-col gap-2">
              <div className="flex justify-between items-end">
                <div className="flex items-center gap-2">
                  <button onClick={() => setShowDiary(true)} className="mc-button mc-diamond px-3 py-1.5 flex items-center gap-1 font-bold text-xs md:text-sm relative">
                    <span className="text-base">📓</span> 信箱
                    {hasNewMsg && <span className="absolute -top-1 -right-1 flex h-4 w-4"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-4 w-4 bg-[#e53935] border-2 border-[#111]"></span></span>}
                  </button>
                  <button onClick={() => setShowCalendar(true)} className="mc-button mc-wood px-3 py-1.5 flex items-center gap-1 font-bold text-xs md:text-sm">
                    <span className="text-base">📅</span> 日曆
                  </button>
                  <button onClick={() => setShowHouseRules(true)} className="mc-button mc-gold px-3 py-1.5 flex items-center gap-1 font-bold text-xs md:text-sm text-[#3e2723] relative">
                    <span className="text-base">📜</span> 家規
                    {hasUnsignedRules && <span className="absolute -top-1 -right-1 flex h-4 w-4"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-4 w-4 bg-[#e53935] border-2 border-[#111]"></span></span>}
                  </button>
                </div>
                <div className="text-right">
                  <div className="text-yellow-300 font-bold text-xs md:text-sm mb-1 tracking-widest" style={{textShadow: '2px 2px 0 #000'}}>{new Date(currentTime).toLocaleTimeString('zh-TW', { hour12: false })}</div>
                  <div className="text-[#81c784] bg-[#111] px-2 py-0.5 border-2 border-[#555] text-xs font-bold inline-block shadow-inner">進度: {completedCount}/{totalCount}</div>
                </div>
              </div>
              <div className="w-full h-4 border-4 border-[#555] border-b-[#aaa] border-r-[#aaa] bg-[#111] overflow-hidden relative shadow-inner">
                <div className="h-full bg-[#44af50] border-t-2 border-[#81c784] transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
